<!doctype html>
<html lang="en" xml:lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>comNG</title>
    <link rel="stylesheet" href="index.css" />
    <meta />
    <script>
      // Apply theme immediately before CSS parsing to prevent flash of wrong theme
      try {
        const store = require('./modules/store.js').init()
        if (store.get('general.darkTheme')) {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {
        // Silent fail during early load - log for debugging
        console.warn('Failed to initialize theme settings:', e)
      }
    </script>
    <script src="fragment-loader.js"></script>
  </head>

  <body>
    <div id="nav-area-placeholder"></div>

    <div id="editor-area"></div>

    <section id="serial-terminal" hidden>
      <div id="terminal-panes">
        <section class="terminal-pane">
          <div id="terminal-primary-controls" class="terminal-connection" hidden>
            <strong i18n-label="terminalPrimary"></strong>
            <select
              id="terminal-primary-port"
              class="browser-default terminal-port"
              i18n-aria-label="selectSerialPort"
            ></select>
            <select
              id="terminal-primary-baud"
              class="browser-default terminal-baud"
              i18n-aria-label="terminalBaud"
            ></select>
            <button
              id="terminal-primary-toggle"
              type="button"
              i18n-label="terminalConnect"
            ></button>
          </div>
          <div id="terminal-toolbar" class="terminal-toolbar">
            <strong id="terminal-single-title" i18n-label="terminalMode"></strong>
            <label
              ><input id="terminal-local-echo" type="checkbox" /><span
                i18n-label="terminalLocalEcho"
              ></span
            ></label>
            <label for="terminal-enter" i18n-label="terminalEnter"></label>
            <select
              id="terminal-enter"
              class="browser-default terminal-enter"
              i18n-aria-label="terminalEnter"
            >
              <option value="cr">CR</option>
              <option value="lf">LF</option>
              <option value="crlf">CRLF</option>
            </select>
            <div class="terminal-log-actions">
              <button id="terminal-save" type="button" i18n-label="terminalSaveLog"></button>
              <button id="terminal-clear" type="button" i18n-label="terminalClear"></button>
            </div>
          </div>
          <div id="terminal-screen" class="terminal-screen"></div>
        </section>
        <section id="terminal-secondary" class="terminal-pane" hidden>
          <div class="terminal-connection">
            <strong i18n-label="terminalSecondary"></strong>
            <select
              id="terminal-secondary-port"
              class="browser-default terminal-port"
              i18n-aria-label="selectSerialPort"
            ></select>
            <select
              id="terminal-secondary-baud"
              class="browser-default terminal-baud"
              i18n-aria-label="terminalBaud"
            ></select>
            <button
              id="terminal-secondary-toggle"
              type="button"
              i18n-label="terminalConnect"
            ></button>
          </div>
          <div id="terminal-secondary-toolbar" class="terminal-toolbar">
            <label
              ><input id="terminal-secondary-local-echo" type="checkbox" /><span
                i18n-label="terminalLocalEcho"
              ></span
            ></label>
            <label for="terminal-secondary-enter" i18n-label="terminalEnter"></label>
            <select
              id="terminal-secondary-enter"
              class="browser-default terminal-enter"
              i18n-aria-label="terminalEnter"
            >
              <option value="cr">CR</option>
              <option value="lf">LF</option>
              <option value="crlf">CRLF</option>
            </select>
            <div class="terminal-log-actions">
              <button
                id="terminal-secondary-save"
                type="button"
                i18n-label="terminalSaveLog"
              ></button>
              <button
                id="terminal-secondary-clear"
                type="button"
                i18n-label="terminalClear"
              ></button>
            </div>
          </div>
          <div id="terminal-secondary-screen" class="terminal-screen"></div>
          <dialog
            id="terminal-secondary-baud-dialog"
            aria-labelledby="terminal-secondary-baud-label"
          >
            <form>
              <label
                id="terminal-secondary-baud-label"
                for="terminal-secondary-baud-input"
                i18n-label="customizedBaudRate"
              ></label>
              <input
                id="terminal-secondary-baud-input"
                class="browser-default"
                type="text"
                inputmode="numeric"
                pattern="[0-9]+"
                maxlength="10"
                required
                autofocus
              />
              <div class="terminal-baud-actions">
                <button type="button" i18n-label="terminalCancel"></button>
                <button type="submit" i18n-label="terminalApply"></button>
              </div>
            </form>
          </dialog>
        </section>
      </div>
      <div id="terminal-hint" i18n-label="terminalHint"></div>
    </section>

    <div id="menu-area" hidden>
      <div class="row" id="menu-handle"></div>

      <div class="row" id="menu-tabs-body">
        <div class="row" id="menu-tabs-row">
          <ul class="tabs" id="menu-tabs">
            <li class="tab col s2">
              <a i18n-label="general" aria-label="General" class="active" href="#general-tab"></a>
            </li>
            <li class="tab col s2">
              <a i18n-label="transmit" aria-label="Transmit" href="#transmit-tab"></a>
            </li>
            <li class="tab col s2">
              <a i18n-label="advance" aria-label="Advance" href="#advance-tab"></a>
            </li>
            <li class="tab col s2">
              <a i18n-label="fileops" aria-label="File Operations" href="#fileops-tab"></a>
            </li>
            <li class="tab col s2">
              <a i18n-label="chart" aria-label="Chart" href="#chart-tab"></a>
            </li>
            <li class="tab col s2">
              <a i18n-label="about" aria-label="About" href="#about-tab"></a>
            </li>
          </ul>
        </div>

        <div id="general-tab-placeholder"></div>
        <div id="transmit-tab-placeholder"></div>
        <div id="advance-tab-placeholder"></div>
        <div id="fileops-tab-placeholder"></div>
        <div id="chart-tab-placeholder"></div>
        <div id="about-tab-placeholder"></div>
        <!-- Tab fragments loaded by fragment-loader.js -->
      </div>
    </div>

    <div id="bar-area-placeholder"></div>

    <!-- You can also require other files to run in this process -->
    <script>
      var indexScript = document.createElement('script')
      indexScript.src = 'index.js'
      indexScript.onload = function () {
        setTimeout(function () {
          var hmScript = document.createElement('script')
          hmScript.src = 'modules/hm.js'
          hmScript.async = true
          document.body.appendChild(hmScript)
        }, 5000)
      }
      document.body.appendChild(indexScript)
    </script>
  </body>
</html>
